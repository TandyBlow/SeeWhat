name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 67.230.171.167
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            LOG=/tmp/acacia-deploy.log
            echo "=== Acacia Deploy $(date -u +'%Y-%m-%dT%H:%M:%SZ') ===" | tee "$LOG"

            echo ">>> git fetch + reset" | tee -a "$LOG"
            cd /opt/acacia
            git fetch origin main 2>&1 | tee -a "$LOG"
            git reset --hard origin/main 2>&1 | tee -a "$LOG"

            echo ">>> write .env" | tee -a "$LOG"
            cat > /opt/acacia/backend/.env << 'ENVEOF'
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            LLM_API_KEY=${{ secrets.LLM_API_KEY }}
            IMAGE_API_KEY=${{ secrets.IMAGE_API_KEY }}
            IMAGE_API_URL=${{ secrets.IMAGE_API_URL }}
            IMAGE_MODEL=${{ secrets.IMAGE_MODEL }}
            DB_PATH=/opt/acacia/data/acacia.db
            ENVEOF
            chmod 600 /opt/acacia/backend/.env
            chown acacia:acacia /opt/acacia/backend/.env

            echo ">>> ensure backgrounds dir writable" | tee -a "$LOG"
            mkdir -p /opt/acacia/frontend/public/backgrounds/ai
            chown -R acacia:acacia /opt/acacia/frontend/public/backgrounds

            echo ">>> pip install" | tee -a "$LOG"
            cd /opt/acacia/backend
            venv/bin/pip install -r requirements.lock --quiet 2>&1 | tee -a "$LOG"

            echo ">>> npm ci" | tee -a "$LOG"
            cd /opt/acacia/frontend
            npm ci --production=false 2>&1 | tee -a "$LOG"

            echo ">>> npm run build" | tee -a "$LOG"
            NODE_OPTIONS="--max-old-space-size=4096" VITE_DATA_MODE=backend VITE_BACKEND_URL=/api npm run build 2>&1 | tee -a "$LOG"

            echo ">>> reset failed state + restart acacia" | tee -a "$LOG"
            sudo systemctl reset-failed acacia 2>&1 | tee -a "$LOG"
            sudo systemctl restart acacia 2>&1 | tee -a "$LOG"
            sleep 2

            echo ">>> health check" | tee -a "$LOG"
            if curl -sf http://127.0.0.1:7860/health; then
              echo " BACKEND OK" | tee -a "$LOG"
            else
              echo " BACKEND FAILED" | tee -a "$LOG"
              echo "=== Backend journal (last 20 lines) ===" | tee -a "$LOG"
              sudo journalctl -u acacia --no-pager -n 20 2>&1 | tee -a "$LOG"
            fi

            echo ">>> update nginx config" | tee -a "$LOG"
            cp /opt/acacia/deploy/nginx.conf /etc/nginx/nginx.conf
            cp /opt/acacia/deploy/acacia.conf /etc/nginx/conf.d/acacia.conf
            nginx -t 2>&1 | tee -a "$LOG"

            echo ">>> systemctl reload nginx" | tee -a "$LOG"
            sudo systemctl reload nginx 2>&1 | tee -a "$LOG"

            echo "=== Deploy finished $(date -u +'%Y-%m-%dT%H:%M:%SZ') ===" | tee -a "$LOG"
